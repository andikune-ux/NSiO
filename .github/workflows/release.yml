name: Release NSiO APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versi release, contoh v1.0.1"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: 📥 Ambil Kode
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: ☕ Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🛠️ Siapkan Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: 🏗️ Build APK installable
        run: gradle assembleDebug --no-daemon

      - name: 🏷️ Siapkan nama file rilis
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "NSiO-${RELEASE_TAG}-debug.apk"

      - name: 🚀 Publikasikan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "NSiO ${{ inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: "NSiO-${{ inputs.tag_name || github.ref_name }}-debug.apk"

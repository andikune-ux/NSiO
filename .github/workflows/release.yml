name: 🛟 NSiO • Manual Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag versi NSiO yang sudah ada dan harus cocok dengan main"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nsio-mainline-release
  cancel-in-progress: false

jobs:
  recover:
    name: 🔍 Verify exact source & version
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🐘 Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🧮 Verify tag, version & latest main
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/compute-nsio-version.sh
          test "$RELEASE_TAG" = "$NSIO_VERSION_TAG"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$CURRENT_MAIN" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: 🧪 Test & build exact APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: 🏷️ Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "NSiO-$RELEASE_TAG-debug.apk"
          sha256sum "NSiO-$RELEASE_TAG-debug.apk" > "NSiO-$RELEASE_TAG-debug.apk.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "NSiO-$RELEASE_TAG-debug.apk" \
            "NSiO-$RELEASE_TAG-debug.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "NSiO $RELEASE_TAG" \
            --generate-notes

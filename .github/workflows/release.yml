name: Release NSiO APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish installable APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Ambil Kode
        uses: actions/checkout@v4

      - name: ☕ Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🛠️ Siapkan Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: 🏗️ Build APK installable
        run: gradle assembleDebug --no-daemon

      - name: 🏷️ Siapkan nama file rilis
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "NSiO-${GITHUB_REF_NAME}-debug.apk"

      - name: 🚀 Publikasikan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NSiO ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: "NSiO-${{ github.ref_name }}-debug.apk"

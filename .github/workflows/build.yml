name: 🚀 NSiO • Parallel CI & Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Each run gets its own group so independent commits are not silently cancelled.
concurrency:
  group: nsio-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  lint:
    name: 🧹 Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: 🧹 Run Android lint
        run: gradle lintDebug --no-daemon
      - name: 🧾 Print complete lint findings
        if: failure()
        shell: bash
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT"
          else
            echo "Lint text report was not generated at the expected path."
            find app/build -iname '*lint*results*.txt' -o -iname '*lint*report*.txt' | head -50
          fi

  unit_tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: 🧪 Run unit tests
        run: gradle testDebugUnitTest --no-daemon

  dependency_report:
    name: 📚 Dependency Report
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: 📊 Generate runtime dependency report
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > dependency-report.txt
          {
            echo "### Runtime dependency report"
            echo 'Generated successfully. Full dependency tree is available in the job log.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 📦 Build & Upload APK
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: 🧮 Calculate NSiO version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NSIO_BUILD_NUMBER="$GITHUB_RUN_NUMBER" bash .github/scripts/compute-nsio-version.sh
          source nsio-version.env
          echo "version_tag=$NSIO_VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$NSIO_VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: 🏗️ Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - name: 📦 Package APK + SHA-256
        shell: bash
        env:
          NSIO_VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "NSiO-${NSIO_VERSION_TAG}-debug.apk"
          sha256sum "NSiO-${NSIO_VERSION_TAG}-debug.apk" | tee "NSiO-${NSIO_VERSION_TAG}-debug.apk.sha256"
      - name: ☁️ Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSiO-${{ steps.version.outputs.version_tag }}
          path: |
            NSiO-${{ steps.version.outputs.version_tag }}-debug.apk
            NSiO-${{ steps.version.outputs.version_tag }}-debug.apk.sha256
          retention-days: 14

  apk_validation:
    name: 🔎 APK Validation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: ⬇️ Download built APK
        uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: verified-apk
      - name: 🔐 Verify checksum and APK archive
        shell: bash
        run: |
          set -euo pipefail
          cd verified-apk
          APK="NSiO-${{ needs.build.outputs.version_tag }}-debug.apk"
          test -s "$APK"
          sha256sum -c "$APK.sha256"
          unzip -t "$APK" >/dev/null
          echo "APK archive and SHA-256 verification passed."
          echo "### APK validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP structure: valid" >> "$GITHUB_STEP_SUMMARY"

  size_report:
    name: 📏 APK Size Report
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: ⬇️ Download built APK
        uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: size-report
      - name: 📏 Report APK size
        shell: bash
        run: |
          set -euo pipefail
          APK="size-report/NSiO-${{ needs.build.outputs.version_tag }}-debug.apk"
          BYTES="$(stat -c '%s' "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          {
            echo "### APK size"
            echo "- APK: $(basename "$APK")"
            echo "- Exact size: $BYTES bytes"
            echo "- Size: $MIB MiB"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 🏷️ Publish Verified Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/heads/') }}
    # Publishing is gated by a successful build and APK integrity check.
    # Lint and unit tests remain independent checks and do not block delivery.
    concurrency:
      group: nsio-release-${{ github.repository }}
      cancel-in-progress: false
    needs: [build, apk_validation]
    steps:
      - name: 📚 Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🧮 Calculate NSiO version
        shell: bash
        env:
          NSIO_BUILD_NUMBER: ${{ github.run_number }}
        run: bash .github/scripts/compute-nsio-version.sh
      - name: ⬇️ Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: release-files
      - name: 🏷️ Publish verified latest release
        env:
          GH_TOKEN: ${{ github.token }}
          NSIO_VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="$GITHUB_REF_NAME"
          CURRENT_BRANCH_SHA="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          if [[ "$CURRENT_BRANCH_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skip release: branch $BRANCH_NAME has advanced to $CURRENT_BRANCH_SHA."
            exit 0
          fi
          if gh release view "$NSIO_VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $NSIO_VERSION_TAG already exists; immutable release will not be overwritten."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$NSIO_VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $NSIO_VERSION_TAG already exists without a matching release; refusing to move it."
            exit 1
          fi
          gh release create "$NSIO_VERSION_TAG" \
            "release-files/NSiO-$NSIO_VERSION_TAG-debug.apk" \
            "release-files/NSiO-$NSIO_VERSION_TAG-debug.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "NSiO $NSIO_VERSION_TAG" \
            --generate-notes

  workflow_summary:
    name: "📝 Rangkuman Hasil Workflow"
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, unit_tests, dependency_report, build, apk_validation, size_report, release, artifact_cleanup]
    steps:
      - name: 📚 Checkout commit details
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 📝 Buat rangkuman dalam bahasa Indonesia
        uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.JOB_RESULTS);
            const labels = {
              lint: "Pemeriksaan kualitas aplikasi",
              unit_tests: "Pengujian fungsi aplikasi",
              dependency_report: "Pemeriksaan pustaka pendukung",
              build: "Pembuatan file APK",
              apk_validation: "Pemeriksaan keamanan dan keutuhan APK",
              size_report: "Pemeriksaan ukuran APK",
              release: "Penerbitan pembaruan aplikasi",
              artifact_cleanup: "Pembersihan file build lama"
            };
            const statusText = {
              success: "✅ Berhasil",
              failure: "❌ Bermasalah",
              cancelled: "⏹️ Dibatalkan",
              skipped: "⏭️ Dilewati",
              '': "⏳ Belum selesai"
            };
            const lines = [
              "## 📝 Rangkuman hasil NSiO",
              "",
              "Berikut laporan otomatis dengan bahasa sederhana. Rangkuman ini tetap dibuat meskipun ada pemeriksaan yang gagal atau dilewati.",
              "",
              "### Hasil setiap bagian"
            ];
            for (const [key, label] of Object.entries(labels)) {
              const result = results[key]?.result || "";
              lines.push(`- ${statusText[result] || "⚠️ Perlu diperiksa"} — **${label}**`);
            }
            const buildOK = results.build?.result === "success";
            const apkOK = results.apk_validation?.result === "success";
            const release = results.release?.result;
            lines.push("", "### Status pembaruan");
            if (buildOK && apkOK && release === "success") {
              lines.push("- ✅ APK berhasil dibuat, diperiksa, dan diterbitkan di halaman Releases.");
            } else if (buildOK && apkOK && release === "skipped") {
              lines.push("- ⚠️ APK berhasil dibuat dan diperiksa, tetapi penerbitan rilis dilewati. Periksa apakah ada proses rilis yang lebih baru atau kondisi rilis yang belum terpenuhi.");
            } else if (buildOK && apkOK) {
              lines.push("- ⚠️ APK berhasil dibuat dan lolos pemeriksaan, tetapi penerbitan rilis belum berhasil dipastikan.");
            } else {
              lines.push("- ❌ APK belum berhasil melewati seluruh tahap pembuatan dan pemeriksaan, sehingga pembaruan belum diterbitkan.");
            }
            lines.push("", "### Fitur dan perubahan pada versi ini");
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, ref: context.sha
            });
            const message = commit.data.commit.message.trim();
            lines.push(`- Perubahan yang tercatat: **${message.split("\n")[0]}**`);
            const body = message.split("\n").slice(1).join("\n").trim();
            if (body) lines.push("", body);
            const files = commit.data.files || [];
            const groups = new Set();
            for (const file of files) {
              const p = file.filename;
              if (p.startsWith("app/src/")) groups.add("Ada perubahan pada aplikasi (tampilan, fitur, atau cara kerja).");
              if (p.startsWith(".github/workflows/")) groups.add("Ada pembaruan pada proses build, pemeriksaan, atau penerbitan aplikasi.");
              if (p.startsWith(".github/scripts/")) groups.add("Ada pembaruan pada proses otomatis dan pengelolaan versi aplikasi.");
              if (p.startsWith("gradle") || p.endsWith(".gradle") || p.endsWith(".gradle.kts")) groups.add("Ada perubahan pada konfigurasi dan pustaka pendukung aplikasi.");
            }
            for (const item of groups) lines.push(`- ${item}`);
            if (!groups.size && !body) lines.push("- Detail fitur tambahan belum dijelaskan pada pesan perubahan commit ini.");
            lines.push("", "### Catatan");
            lines.push("- Jika ada bagian bertanda bermasalah, buka bagian job terkait untuk melihat penyebabnya.");
            lines.push("- Pemeriksaan kualitas dan pengujian tetap dilaporkan terpisah dari proses penerbitan APK.");
            await core.summary.addRaw(lines.join("\n")).write();

  artifact_cleanup:
    name: 🧹 Retain 3 Newest Artifacts
    runs-on: ubuntu-latest
    needs: [build, release]
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: 🧹 Delete older workflow artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, per_page: 100
              });
              const buildRuns = runs.filter(run => run.path === ".github/workflows/build.yml");
              const artifacts = [];
              for (const run of buildRuns) {
                const items = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner, repo, run_id: run.id, per_page: 100
                });
                artifacts.push(...items.filter(item => !item.expired));
              }
              artifacts.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              for (const artifact of artifacts.slice(3)) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                } catch (error) {
                  if (error.status === 404) continue;
                  if (error.status === 403 || error.status === 429 || error.status >= 500) {
                    core.warning(`Artifact cleanup paused by GitHub API (HTTP ${error.status}); build remains successful.`);
                    break;
                  }
                  throw error;
                }
              }
            } catch (error) {
              core.warning(`Artifact retention skipped; build/package result is unaffected: ${error.message}`);
            }

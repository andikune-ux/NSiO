name: Build APK NSiO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Prevent overlapping cleanup jobs from racing to delete the same artifacts.
concurrency:
  group: nsio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Ambil Kode
        uses: actions/checkout@v4

      - name: ☕ Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 📲 Simpan Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: NSiO-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 🧹 Bersihkan Artifact Lama (sisakan 3 terbaru)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // List repository runs, then filter by the workflow's path.
            // This avoids relying on optional workflow context fields or IDs.
            const allRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });
            const runs = allRuns.filter(run => run.path === ".github/workflows/build.yml");

            const artifacts = [];
            for (const run of runs) {
              const runArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              artifacts.push(...runArtifacts.filter(item => !item.expired));
            }

            artifacts.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const obsolete = artifacts.slice(3);
            for (const artifact of obsolete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted old artifact ${artifact.name} (#${artifact.id}) from ${artifact.created_at}`);
              } catch (error) {
                // Concurrent workflow runs may already have deleted this artifact.
                if (error.status === 404) {
                  core.info(`Artifact #${artifact.id} was already removed by another cleanup run.`);
                  continue;
                }
                throw error;
              }
            }
            core.info(`Artifact aktif: ${Math.min(artifacts.length, 3)} dipertahankan, ${obsolete.length} dihapus.`);

name: Build APK NSiO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Ambil Kode
        uses: actions/checkout@v4

      - name: ☕ Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 📲 Simpan Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: NSiO-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 🧹 Bersihkan Artifact Lama (sisakan 3 terbaru)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = context.workflow.id;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowId,
              per_page: 100
            });

            const artifacts = [];
            for (const run of runs) {
              const runArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              artifacts.push(...runArtifacts.filter(item => !item.expired));
            }

            artifacts.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const obsolete = artifacts.slice(3);
            for (const artifact of obsolete) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted old artifact ${artifact.name} (#${artifact.id}) from ${artifact.created_at}`);
            }
            core.info(`Artifact aktif: ${Math.min(artifacts.length, 3)} dipertahankan, ${obsolete.length} dihapus.`);

name: NSiO Main CI Build Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nsio-main-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tdlib_runtime:
    name: "📚 Prepare pinned TDLib runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Download permanent pinned TDLib API 24 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/tdlib-api24"
          mkdir -p "$DEST"
          TAG="tdlib-1.8.70-api24"
          ARCHIVE="NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          # The TDLib publishing workflow may be creating the first permanent release
          # in parallel with this build. Wait for that release; never rebuild TDLib here.
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Pinned TDLib release not published yet (attempt $attempt/20); waiting 15s."
            sleep 15
          done
          gh release view "$TAG" >/dev/null
          gh release download "$TAG" --pattern "$ARCHIVE" --pattern "$CHECKSUM" --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c "$CHECKSUM"
          tar -xzf "$ARCHIVE" -C "$DEST"
      - name: Validate TDLib runtime payload
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/tdlib-api24/java/org/drinkless/tdlib/Client.java"
          test -s "$RUNNER_TEMP/tdlib-api24/java/org/drinkless/tdlib/TdApi.java"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$RUNNER_TEMP/tdlib-api24/jniLibs/$abi/libtdjni.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NSiO-TDLib-runtime
          path: ${{ runner.temp }}/tdlib-api24/
          if-no-files-found: error
          retention-days: 1

  lint:
    name: 🧹 Lint Check
    runs-on: ubuntu-latest
    needs: [tdlib_runtime]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-TDLib-runtime
          path: ${{ runner.temp }}/tdlib-api24
      - name: Stage verified TDLib Java/JNI runtime
        run: bash scripts/prepare-tdlib-android-api24.sh "${{ runner.temp }}/tdlib-api24"
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Run Android lint
        run: gradle lintDebug --no-daemon
      - name: Print lint report on failure
        if: failure()
        run: find app/build -type f -iname '*lint*' -print -exec cat {} \; || true

  unit_tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [tdlib_runtime]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-TDLib-runtime
          path: ${{ runner.temp }}/tdlib-api24
      - name: Stage verified TDLib Java/JNI runtime
        run: bash scripts/prepare-tdlib-android-api24.sh "${{ runner.temp }}/tdlib-api24"
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Run unit tests (retry transient Robolectric downloads)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Unit test attempt $attempt/3"
            if gradle testDebugUnitTest --no-daemon --stacktrace; then
              exit 0
            fi
            status=$?
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 20))
              echo "Unit tests failed; retrying after ${delay}s. This also retries transient Robolectric SDK download failures."
              sleep "$delay"
            fi
          done
          echo "Unit tests failed after 3 attempts."
          exit 1
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NSiO-unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  dependency_report:
    name: 📚 Dependency Report
    runs-on: ubuntu-latest
    needs: [tdlib_runtime]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-TDLib-runtime
          path: ${{ runner.temp }}/tdlib-api24
      - name: Stage verified TDLib Java/JNI runtime
        run: bash scripts/prepare-tdlib-android-api24.sh "${{ runner.temp }}/tdlib-api24"
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Generate runtime dependency report
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > dependency-report.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NSiO-dependencies-${{ github.run_number }}
          path: dependency-report.txt
          retention-days: 14

  build:
    name: 📦 Build & Upload APK
    runs-on: ubuntu-latest
    needs: [tdlib_runtime]
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-TDLib-runtime
          path: ${{ runner.temp }}/tdlib-api24
      - name: Stage verified TDLib Java/JNI runtime
        run: bash scripts/prepare-tdlib-android-api24.sh "${{ runner.temp }}/tdlib-api24"
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Calculate NSiO version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/compute-nsio-version.sh
          source nsio-version.env
          echo "version_tag=$NSIO_VERSION_TAG" >> "$GITHUB_OUTPUT"
      - name: Assemble APK
        run: gradle assembleDebug --no-daemon
      - name: Package APK and checksum
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "NSiO-$VERSION_TAG-debug.apk"
          sha256sum "NSiO-$VERSION_TAG-debug.apk" | tee "NSiO-$VERSION_TAG-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: NSiO-${{ steps.version.outputs.version_tag }}
          path: |
            NSiO-${{ steps.version.outputs.version_tag }}-debug.apk
            NSiO-${{ steps.version.outputs.version_tag }}-debug.apk.sha256
          retention-days: 14

  apk_validation:
    name: 🔎 APK Validation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: verified-apk
      - name: Verify checksum and APK archive
        run: |
          set -euo pipefail
          cd verified-apk
          APK="NSiO-${{ needs.build.outputs.version_tag }}-debug.apk"
          test -s "$APK"
          sha256sum -c "$APK.sha256"
          unzip -t "$APK" >/dev/null

  size_report:
    name: 📏 APK Size Report
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: size-report
      - name: Report APK size
        run: |
          APK="size-report/NSiO-${{ needs.build.outputs.version_tag }}-debug.apk"
          BYTES="$(stat -c '%s' "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          echo "APK size: $BYTES bytes ($MIB MiB)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 🏷️ Publish validated APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build, lint, unit_tests, apk_validation]
    if: ${{ always() && needs.build.result == 'success' && needs.lint.result == 'success' && needs.unit_tests.result == 'success' && needs.apk_validation.result == 'success' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: nsio-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: NSiO-${{ needs.build.outputs.version_tag }}
          path: release-files
      - name: Publish immutable version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        run: |
          set -euo pipefail
          APK="release-files/NSiO-$VERSION_TAG-debug.apk"
          CHECKSUM="$APK.sha256"
          test -s "$APK"
          test -s "$CHECKSUM"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets are not overwritten."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag exists without release; refusing to move it."
            exit 1
          fi
          gh release create "$VERSION_TAG" "$APK" "$CHECKSUM" --target "$GITHUB_SHA" --title "NSiO $VERSION_TAG" --generate-notes

  artifact_cleanup:
    name: 🧹 Retain 3 Newest Build Artifacts
    runs-on: ubuntu-latest
    needs: [build, release]
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Delete old artifacts (best effort)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
              const artifacts = [];
              for (const run of runs.filter(item => item.path === ".github/workflows/build.yml")) {
                const items = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: run.id, per_page: 100 });
                artifacts.push(...items.filter(item => !item.expired));
              }
              artifacts.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              for (const artifact of artifacts.slice(3)) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                } catch (error) {
                  if (error.status === 404) continue;
                  if ([403, 429].includes(error.status) || error.status >= 500) {
                    core.warning("Artifact cleanup paused by API limits; build and release are unaffected.");
                    break;
                  }
                  throw error;
                }
              }
            } catch (error) {
              core.warning(`Artifact cleanup skipped; build/release unaffected: ${error.message}`);
            }

  workflow_summary:
    name: 📝 Rangkuman Hasil Workflow
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, unit_tests, dependency_report, build, apk_validation, size_report, release, artifact_cleanup]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Create complete Indonesian summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "## 📝 Rangkuman hasil NSiO"
            echo
            echo "### Status setiap pekerjaan"
            echo "$JOB_RESULTS" | jq -r '
              {
                lint: "Lint Check",
                unit_tests: "Unit Tests",
                dependency_report: "Dependency Report",
                build: "Build APK",
                apk_validation: "Validasi APK",
                size_report: "Laporan ukuran APK",
                release: "Publikasi GitHub Release",
                artifact_cleanup: "Pembersihan artifact lama"
              } as $labels
              | to_entries[]
              | "- " + (if .value.result == "success" then "✅ Berhasil" elif .value.result == "failure" then "❌ Gagal" elif .value.result == "cancelled" then "⏹️ Dibatalkan" elif .value.result == "skipped" then "⏭️ Dilewati" else "⏳ Tidak diketahui" end) + " — **" + $labels[.key] + "**"
            '
            BUILD="$(echo "$JOB_RESULTS" | jq -r '.build.result // "unknown"')"
            VALID="$(echo "$JOB_RESULTS" | jq -r '.apk_validation.result // "unknown"')"
            RELEASE="$(echo "$JOB_RESULTS" | jq -r '.release.result // "unknown"')"
            echo
            LINT="$(echo "$JOB_RESULTS" | jq -r '.lint.result // "unknown"')"
            TESTS="$(echo "$JOB_RESULTS" | jq -r '.unit_tests.result // "unknown"')"
            if [[ "$BUILD" == success && "$VALID" == success && "$LINT" == success && "$TESTS" == success && "$RELEASE" == success ]]; then
              echo "✅ Build, lint, unit test, validasi APK, dan publikasi Release berhasil. Rilis ini siap ditemukan oleh pemeriksaan update NSiO."
            elif [[ "$BUILD" == success && "$RELEASE" == skipped ]]; then
              echo "⏭️ APK berhasil dibuat, tetapi Release sengaja ditahan karena satu atau lebih validasi wajib gagal atau tidak berhasil."
            elif [[ "$BUILD" == success && "$RELEASE" != success ]]; then
              echo "⚠️ APK berhasil dibuat, tetapi publikasi Release belum berhasil. Periksa job Release dan izin GitHub token."
            else
              echo "❌ Build APK gagal; tanpa APK hasil build, Release tidak dapat diterbitkan."
            fi
            echo
            echo "### Commit"
            echo "- SHA: $GITHUB_SHA"
            echo "- Pesan: $(git log -1 --pretty=%s)"
            echo
            echo "Lint dan Unit Test berjalan paralel dengan Build. Publikasi Release menunggu Build, Lint, Unit Test, dan APK Validation semuanya berhasil. Dependency Report dan laporan ukuran tetap menjadi pekerjaan pendukung."
          } >> "$GITHUB_STEP_SUMMARY"

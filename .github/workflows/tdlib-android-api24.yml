name: NSiO TDLib Android API 24
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tdlib-android-api24.yml"
permissions:
  contents: write
  actions: read

jobs:
  publish_tdlib:
    name: "📦 Publish pinned TDLib API 24 runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download validated TDLib API 24 build
        uses: actions/download-artifact@v4
        with:
          name: NSiO-TDLib-1.8.70-Android-API24
          repository: andikune-ux/NSiO
          run-id: 45986064975
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/tdlib-api24
      - name: Verify runtime and create release archive
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/tdlib-api24"
          test -s "$ROOT/java/org/drinkless/tdlib/Client.java"
          test -s "$ROOT/java/org/drinkless/tdlib/TdApi.java"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$ROOT/jniLibs/$abi/libtdjni.so"
          done
          (
            cd "$ROOT"
            awk '{ path = $2; prefix = "tdlib-api24-output/"; pos = index(path, prefix); if (pos > 0) path = substr(path, pos + length(prefix)); print $1 "  " path }' SHA256SUMS | sha256sum -c -
          )
          ARCHIVE="$RUNNER_TEMP/NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          tar -czf "$ARCHIVE" -C "$ROOT" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish immutable TDLib runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tdlib-1.8.70-api24"
          ARCHIVE="$RUNNER_TEMP/NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          RELEASE_JSON="$RUNNER_TEMP/tdlib-release.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/existing-tdlib-release"
            gh release download "$TAG" --pattern "$(basename "$ARCHIVE")" --dir "$RUNNER_TEMP/existing-tdlib-release"
            cmp "$ARCHIVE" "$RUNNER_TEMP/existing-tdlib-release/$(basename "$ARCHIVE")"
            echo "Pinned TDLib release already exists and matches the verified artifact."
          else
            gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" --title "NSiO TDLib 1.8.70 Android API 24" --notes "Pinned TDLib 1.8.70 Java/JNI runtime built for Android API 24. ABIs: arm64-v8a, armeabi-v7a, x86_64, x86. Source commit: c8828d50f5eac2fc7089ce1089d7ce9095c61b5e."
          fi

name: NSiO TDLib Android API 24
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write

jobs:
  build_tdlib:
    name: "🔧 Build TDLib API 24 (4 Android ABIs)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/android-commandline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
      - name: Install TDLib build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl make zip unzip
      - name: Build official TDLib Java/JNI for API 24
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          bash scripts/build-tdlib-android-api24.sh "$RUNNER_TEMP/tdlib-api24-output"
      - name: Validate packaged ABI set and Java bindings
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/tdlib-api24-output/java/org/drinkless/tdlib/Client.java"
          test -s "$RUNNER_TEMP/tdlib-api24-output/java/org/drinkless/tdlib/TdApi.java"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$RUNNER_TEMP/tdlib-api24-output/jniLibs/$abi/libtdjni.so"
          done
          cd "$RUNNER_TEMP/tdlib-api24-output"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NSiO-TDLib-1.8.70-Android-API24
          path: ${{ runner.temp }}/tdlib-api24-output/
          if-no-files-found: error
          retention-days: 30
      - name: Package reproducible TDLib runtime
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          tar -czf "$ARCHIVE" -C "$RUNNER_TEMP/tdlib-api24-output" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish immutable TDLib runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tdlib-1.8.70-api24"
          ARCHIVE="$RUNNER_TEMP/NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-tdlib-release"
            gh release download "$TAG" --pattern "$(basename "$ARCHIVE")" --dir "$RUNNER_TEMP/existing-tdlib-release"
            cmp "$ARCHIVE" "$RUNNER_TEMP/existing-tdlib-release/$(basename "$ARCHIVE")"
            echo "Pinned TDLib release already exists and matches this reproducible build."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "TDLib tag exists without a release; refusing to move it."
              exit 1
            fi
            gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" --target "$GITHUB_SHA" --title "NSiO TDLib 1.8.70 Android API 24" --notes "Pinned TDLib 1.8.70 Java/JNI runtime built for Android API 24. Includes arm64-v8a, armeabi-v7a, x86_64, and x86. Source commit: c8828d50f5eac2fc7089ce1089d7ce9095c61b5e."
          fi

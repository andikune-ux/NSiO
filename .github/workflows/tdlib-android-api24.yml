name: NSiO TDLib Android API 24 — Permanent pinned runtime
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify_tdlib:
    name: "🔒 Verify permanent TDLib API 24 runtime"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned TDLib release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tdlib-1.8.70-api24"
          ARCHIVE="NSiO-TDLib-1.8.70-Android-API24.tar.gz"
          gh release view "$TAG" >/dev/null
          gh release download "$TAG" --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c "$ARCHIVE.sha256"
          mkdir -p tdlib-api24
          tar -xzf "$ARCHIVE" -C tdlib-api24
      - name: Validate pinned Java and JNI payload
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/tdlib-api24"
          test -s "$ROOT/java/org/drinkless/tdlib/Client.java"
          test -s "$ROOT/java/org/drinkless/tdlib/TdApi.java"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "$ROOT/jniLibs/$abi/libtdjni.so"
          done
          echo "Permanent TDLib 1.8.70 API 24 runtime is present and checksum-valid."
